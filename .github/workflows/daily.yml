name: 每日广告资源聚合

on:
  schedule:
    - cron: "17 4 * * *"   # 每天 04:17 UTC = 北京 12:17（避开整点高峰，减少 GitHub cron 延迟）
  workflow_dispatch:       # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 注入仓库地址并生成
        env:
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/main/script
        run: |
          python generator.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日广告资源自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
